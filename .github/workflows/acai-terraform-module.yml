name: ACAI TERRAFORM MODULE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  hcl_module_checks:
    uses: acai-solutions/github-workflows/.github/workflows/checks-hcl-module.yml@main
    if: ${{ github.event_name == 'pull_request' }}
    with:
      hcl_test_beds: '["AWS", "AWS_ESC"]'
      hcl_test_bed_aws_terratest_configs: '["aws/matrix_tf1x5x7_aws5x80x0.json", "aws/matrix_ofu1x6x0_aws5x80x0.json"]'
      hcl_test_bed_aws_esc_terratest_configs: '["aws/matrix_tf1x14x0_aws6x29x0.json", "aws/matrix_ofu1x9x0_aws6x29x0.json"]'
    secrets: inherit

    
  hcl_module_release:
    uses: acai-solutions/github-workflows/.github/workflows/hcl-module-release.yml@main
    if: ${{ github.event_name == 'push' }}
    secrets: inherit
